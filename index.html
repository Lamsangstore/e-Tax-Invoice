<meta name="robots" content="noindex">
<!--
  ย้ายไปแล้ว (30 ก.ย. 2569) — ฟอร์มขอใบกำกับภาษีอยู่ที่เว็บร้าน lamsangstore.com/etax
  หน้าใหม่รู้จักคำสั่งซื้อเอง (ช่องทาง วันที่ส่ง ยอดเงิน · ออเดอร์เว็บเติมชื่อ/ที่อยู่ให้)
  และคำขอไปอยู่ที่หลังบ้าน (ใบกำกับภาษี → คำขอจากลูกค้า) แทน Google Sheet
  ไฟล์ฟอร์มเดิมยังดูได้ในประวัติ git ของ repo นี้
-->
<meta http-equiv="refresh" content="0; url=https://lamsangstore.com/etax">
<link rel="canonical" href="https://lamsangstore.com/etax">
<script>
  /* ส่งต่อเลขที่คำสั่งซื้อถ้าลิงก์เดิมมี ?o= หรือ ?order= ติดมา */
  (function () {
    var q = new URLSearchParams(location.search);
    var o = q.get('o') || q.get('order') || '';
    location.replace('https://lamsangstore.com/etax' + (o ? '?o=' + encodeURIComponent(o) : ''));
  })();
</script>

</style>
</head>
